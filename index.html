<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Closet</title>

<script src="script.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body>

<!-- HOME -->
<section id="home" class="screen active">

<div class="logo-area">
<h1>Meu Closet</h1>
<p>Monte looks incríveis 💖</p>
</div>

<div class="menu-home">
<button onclick="openScreen('closet')">👗 Meu Guarda-Roupa</button>
<button onclick="openScreen('add')">➕ Adicionar Roupa</button>
<button onclick="openScreen('look')">✨ Look do Dia</button>
</div>

</section>

<!-- CLOSET -->
<section id="closet" class="screen">

<div class="topbar">
<button class="back" onclick="openScreen('home')">←</button>
<h2>Meu Guarda-Roupa</h2>
</div>

<div id="lista" class="grid"></div>

</section>

<!-- ADICIONAR -->
<section id="add" class="screen">

<div class="topbar">
<button class="back" onclick="openScreen('home')">←</button>
<h2>Nova Roupa</h2>
</div>

<div class="formulario">
<input id="nome" placeholder="Nome da roupa">

<select id="categoria">
<option>Blusa</option>
<option>Calça</option>
<option>Vestido</option>
<option>Saia</option>
<option>Sapato</option>
<option>Jaqueta</option>
</select>

<input id="cor" placeholder="Cor">

<label class="upload">
</html>
