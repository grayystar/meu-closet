<title>Meu Closet</title>

</head>
<body>

<!-- TELA INICIAL -->
<div id="home" class="tela ativa">
<h1>👗 Meu Closet</h1>

<button onclick="ir('closet')">Abrir Meu Closet</button>
<button onclick="ir('add')">Adicionar Nova Peça</button>
<button onclick="ir('look')">Montar um Look</button>
</div>

<!-- TELA CLOSET -->
<div id="closet" class="tela">
<h2>👚 Meu Closet</h2>

<div id="lista"></div>

<button onclick="ir('home')">⬅ Voltar</button>
</div>

<!-- TELA ADICIONAR -->
<div id="add" class="tela">
<h2>➕ Nova Roupa</h2>

<input id="nome" placeholder="Nome">
<input type="file" id="foto">
<select id="categoria">
<option>Blusa</option>
<option>Calça</option>
<option>Vestido</option>
<option>Sapato</option>
</select>

<input id="cor" placeholder="Cor">

<button onclick="adicionar()">Salvar</button>
<button onclick="ir('home')">⬅ Voltar</button>
</div>

<!-- TELA LOOK -->
<div id="look" class="tela">
<h2>✨ Look do Dia</h2>

<div id="lookResultado"></div>

<button onclick="gerarLook()">Gerar Look</button>
<button onclick="ir('home')">⬅ Voltar</button>
</div>
